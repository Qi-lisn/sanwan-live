<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三万大肥鱼 · 海滨外卖城</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#0b1730;overflow:hidden;font-family:Inter,'Microsoft YaHei',system-ui,sans-serif}
#viewport{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{position:absolute;width:1672px;height:941px;transform-origin:center center;overflow:hidden;background:#8ad6fa}
#cityBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;pointer-events:none}
#roadCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rider{position:absolute;left:0;top:0;width:95px;height:95px;z-index:5;transform:translate(-50%,-82%);pointer-events:none;filter:drop-shadow(0 4px 4px #18304b77);will-change:left,top,transform}
#rider.walking{width:78px;height:78px}#rider img{width:100%;height:100%;display:block;object-fit:contain}
#rider .shadow{position:absolute;bottom:8px;left:30%;width:40%;height:8%;background:#0003;border-radius:100%;filter:blur(3px);z-index:-1}
#riderImg.reacting{animation:fishReact .22s ease-in-out 5 alternate}
@keyframes fishReact{to{transform:translateY(-9px) rotate(2deg)}}
.top{position:absolute;top:23px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:7}
.banner,.livetag{box-shadow:0 8px 26px #18223b27;backdrop-filter:blur(12px)}
.banner{background:#ffffffed;padding:13px 18px;border:1px solid #fff;border-radius:16px;color:#263959}
.banner b{font-size:20px}.banner small{display:block;margin-top:6px;color:#5d7296;font-size:12px}
.livetag{display:flex;align-items:center;gap:9px;border:1px solid #ffffff70;border-radius:99px;padding:11px 16px;background:#172c4edf;color:#fff;font-weight:700;font-size:13px}
.livetag:before{content:'';width:9px;height:9px;border-radius:50%;background:#ff5070;box-shadow:0 0 0 5px #ff52702b}
#statusbar{position:absolute;bottom:24px;left:24px;z-index:7;min-width:330px;width:410px;max-width:39%;padding:15px 18px;background:#152440e8;color:#fff;border-radius:19px;border:1px solid #d1e1ff42;box-shadow:0 15px 34px #10243b42;backdrop-filter:blur(12px)}
#badge{display:inline-block;background:#6a69d54a;color:#d4dfff;padding:5px 9px;font-size:11px;border-radius:8px;font-weight:800}
#orderName{font-size:20px;font-weight:850;margin-top:10px}#destination{font-size:13px;color:#bcd0e8;margin-top:7px}
#progressTrack{margin:13px 0 8px;background:#66759466;border-radius:20px;height:7px;overflow:hidden}#progressBar{width:0;height:100%;background:linear-gradient(90deg,#ffbd7d,#a98bff,#5ed6ff);border-radius:20px;transition:width .8s linear}
#statusFooter{font-size:12px;display:flex;justify-content:space-between;color:#9eb9d6}
#stats{position:absolute;bottom:25px;right:24px;z-index:7;display:flex;gap:9px;pointer-events:none}
.stat{min-width:112px;background:#ffffffec;border-radius:14px;border:1px solid #fff;box-shadow:0 9px 28px #19324a24;padding:11px 15px;color:#23405a}
.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:#7189a2;display:block;margin-top:4px}
#bubble{position:absolute;z-index:8;left:50%;top:20%;padding:11px 20px;background:#24365ce6;color:#fff;border:1px solid #d6e0ff65;border-radius:99px;font-weight:800;font-size:18px;opacity:0;transform:translateX(-50%) translateY(-10px);transition:opacity .25s,transform .25s;box-shadow:0 9px 28px #0e274c55;pointer-events:none}
#bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
#speech{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);z-index:28;max-width:70%;padding:12px 20px;background:#172440eF;color:white;border-radius:15px;font-size:22px;text-align:center;display:none}
#notice{position:absolute;top:88px;right:24px;font-size:11px;border-radius:7px;color:#ffebbf;background:#263047da;padding:7px 10px;z-index:9;display:none}
#night{position:absolute;inset:0;background:#1423444d;mix-blend-mode:multiply;pointer-events:none;display:none;z-index:6}
#credits{position:absolute;left:26px;bottom:180px;z-index:7;background:#ffffffb5;color:#45627e;border-radius:8px;padding:5px 9px;font-size:10px}

#aiBadge{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:30;
  background:rgba(12,16,28,.88);border:1px solid rgba(150,170,230,.45);border-radius:999px;
  padding:9px 26px;font-size:19px;letter-spacing:2px;color:#e8eeff;white-space:nowrap;
  box-shadow:0 6px 24px rgba(0,0,0,.45)}
#aiBadge b{color:#9fd0ff}

#playbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:26;
  background:rgba(10,14,26,.82);border:1px solid rgba(150,170,230,.4);border-radius:999px;
  padding:8px 22px;font-size:17px;letter-spacing:1px;color:#dfe7ff;white-space:nowrap}
#playbar b{color:#ffd08a}
#goal{position:absolute;right:22px;top:74px;z-index:26;background:rgba(10,14,26,.82);
  border:1px solid rgba(150,170,230,.4);border-radius:14px;padding:10px 16px;min-width:186px;color:#e8eeff}
#goal .t{font-size:14px;color:#9fb0dd;letter-spacing:2px}
#goal .n{font-size:24px;margin-top:2px}
#goal .n b{color:#ffd08a}
#goal .bar{height:7px;border-radius:6px;background:#26304d;margin-top:8px;overflow:hidden}
#goal .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffbd7d,#a98bff);transition:width .6s}
</style>
</head>
<body>
<div id="viewport"><main id="stage">
  <img id="cityBg" src="city_assets/city_map.png" alt="海滨城市地图">
  <canvas id="roadCanvas" width="1672" height="941"></canvas>
  <div id="rider"><div class="shadow"></div><img id="riderImg" src="city_assets/ride_0.png" alt="大肥鱼骑手"></div>
  <div id="night"></div>
  <div id="aiBadge">本直播间为 <b>AI 虚拟形象</b> · 无真人出镜 · 画面为游戏化模拟</div>
  <div class="top"><div class="banner"><b>🐟 三万大肥鱼 · 外卖人生</b><small id="caption">海滨外卖城 · AI 虚拟主播 · 本地模拟订单</small></div><div class="livetag">虚拟直播中</div></div>
  <div id="notice"></div><div id="bubble"></div><div id="speech"></div>
  <section id="statusbar"><span id="badge">等待接单</span><div id="orderName">大肥鱼正在摸鱼 🐟</div><div id="destination">送外卖这件事，也是从摸鱼开始的。</div><div id="progressTrack"><div id="progressBar"></div></div><div id="statusFooter"><span id="distance">等待派单</span><span id="left">—</span></div></section>
  <div id="goal"><div class="t">本场目标</div><div class="n"><b id="goalDone">0</b> / <span id="goalAll">20</span> 单</div><div class="bar"><i id="goalBar"></i></div></div>
<div id="playbar">发「<b>下一单去学校</b>」我就去 · 问「<b>送哪</b>」我答 · 打「<b>1</b>」让我看见你</div>
<section id="stats"><div class="stat"><b id="delivered">0</b><span>完成订单</span></div><div class="stat"><b id="earned">¥ 0.0</b><span>游戏模拟收入</span></div><div class="stat"><b id="late">0</b><span>超时订单</span></div></section>
  <div id="credits">AI 虚拟主播 · 游戏化模拟场景 · 非真实接单</div>
</main></div>
<script>
'use strict';
(()=>{
const S={w:1672,h:941}, $=s=>document.querySelector(s), stage=$('#stage'),cv=$('#roadCanvas'),ctx=cv.getContext('2d');
const rider=$('#rider'),riderImg=$('#riderImg');
const qs=new URLSearchParams(location.search), demo=qs.get('demo')==='1';
function fit(){let scale=Math.min(innerWidth/S.w,innerHeight/S.h);stage.style.transform='scale('+scale+')'}window.addEventListener('resize',fit);fit();
const SPRITES={ride:[0,1,2,3].map(i=>`city_assets/ride_${i}.png`),walk:[0,1,2,3].map(i=>`city_assets/walk_${i}.png`)};
for(let a of Object.values(SPRITES))a.forEach(s=>{const im=new Image();im.src=s});
// Points are surveyed against the 1672x941 concept-map pixels. These are visual game positions, not GPS coordinates.
// —— 路网（按 1672×941 概念图实测，节点只放在道路上）——
const NODES={
  A:[835,700],  B:[500,700],  C:[1250,700],      // 滨水大道
  D:[835,520],  E:[500,520],  F:[1250,520],      // 中横路
  G:[835,300],  H:[500,300],  I:[1250,300],      // 上横路
  J:[160,210],  K:[1445,430], L:[1320,235], M:[1130,235],   // 公司/商场/学校/小区
  N:[610,365],  O:[760,330],  P:[1150,345], Q:[505,600],
  R:[1010,230],                                   // 医院（上排中间那栋白楼）
  U:[1130,300], V:[1445,520]                      // 小区路口、商场前路
};
const EDGES=[['A','B'],['A','C'],['A','D'],['D','E'],['D','F'],['D','G'],
             ['E','H'],['F','I'],['G','H'],['G','I'],['H','J'],['I','K'],
             ['I','L'],['I','M'],['N','H'],['N','G'],['G','O'],['P','I'],['P','F'],['B','Q'],
             ['D','Q'],['G','L'],['R','G'],['R','I'],['U','G'],['U','I'],['U','M'],['V','F'],['V','K']];
const START=[835,700];
const PLACE_NODE={'便利店':'Q','小区':'M','学校':'L','医院':'R','商场':'K','公司':'J'};
const SHOP_NODE='N';

function bfsPath(from,to){
  // Dijkstra：按实际像素距离选最短，避免"边数少但绕远"的路径
  const adj={}; for(const [a,b] of EDGES){ (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); }
  const dist={}, prev={}, seen=new Set();
  dist[from]=0;
  while(true){
    let u=null,best=Infinity;
    for(const k in dist) if(!seen.has(k)&&dist[k]<best){best=dist[k];u=k}
    if(u===null||u===to) break;
    seen.add(u);
    for(const v of (adj[u]||[])){
      const w=Math.hypot(NODES[v][0]-NODES[u][0], NODES[v][1]-NODES[u][1]);
      if(dist[v]===undefined||dist[u]+w<dist[v]){dist[v]=dist[u]+w;prev[v]=u}
    }
  }
  const path=[]; let cur=to;
  while(cur!==undefined){ path.unshift(cur); cur=prev[cur] }
  return path.length>1?path.map(k=>NODES[k]):[NODES[from],NODES[to]];
}

const HUB=START, PICKUP=NODES[SHOP_NODE];
const HUB_ROUTE=bfsPath('A',SHOP_NODE);
const LOCATIONS={};
for(const name of ['便利店','小区','学校','医院','商场','公司']){
  const node=PLACE_NODE[name]||'M';
  LOCATIONS[name]={id:name, point:NODES[node], route:bfsPath(SHOP_NODE,node)};
}

function pathLen(points){return points.slice(1).reduce((a,p,i)=>a+Math.hypot(p[0]-points[i][0],p[1]-points[i][1]),0)}
function sample(points,t){let total=pathLen(points),d=Math.max(0,Math.min(1,t))*total;for(let i=1;i<points.length;i++){let p=points[i-1],q=points[i],len=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<=len||i===points.length-1){let k=len?Math.max(0,Math.min(1,d/len)):0;return {x:p[0]+(q[0]-p[0])*k,y:p[1]+(q[1]-p[1])*k,angle:Math.atan2(q[1]-p[1],q[0]-p[0])}}d-=len}return {x:points[0][0],y:points[0][1],angle:0}}
let state=null, lastSeq=-1,lastStatus='idle',lastResult='',ticker=0,lastAt=performance.now(), displayed={x:HUB[0],y:HUB[1],angle:0},latest={x:HUB[0],y:HUB[1],angle:0};
const mock={phase:'idle',progress:0,seq:0,dest:'小区',earned:0,delivered:0,late:0,limit:45,started:0,now:0};
function simulate(dt){mock.now+=dt;if(mock.phase==='idle'){mock.phase='accepted';mock.progress=0;mock.seq++;mock.started=mock.now}
 else if(mock.phase==='accepted'){mock.progress+=dt/8;if(mock.progress>=1){mock.progress=0;mock.phase='carrying'}}
 else if(mock.phase==='carrying'){mock.progress+=dt/18;if(mock.progress>=1){mock.phase='idle';mock.progress=0;mock.earned+=6.8;mock.delivered++}}
 return {status:mock.phase,progress:mock.phase==='accepted'?mock.progress*.25:mock.phase==='carrying'?.25+mock.progress*.75:0,phase_progress:mock.progress,earned:mock.earned,delivered:mock.delivered,late:mock.late,total:mock.seq,last_result:mock.phase==='idle'&&mock.delivered?'送达成功': '',left:Math.max(0,Math.round(45-(mock.now-mock.started))),order:mock.phase==='idle'?null:{seq:mock.seq,good:'奶茶',place_name:mock.dest,x:1180,y:700,pay:6.8,limit:45}};
}
function showMessage(message){const el=$('#bubble');el.textContent=message;el.classList.add('show');clearTimeout(showMessage.t);showMessage.t=setTimeout(()=>el.classList.remove('show'),3000)}
function update(d){if(!d||typeof d!=='object')return;state=d;
 const hasOrder=!!d.order, location=hasOrder?(LOCATIONS[d.order.place_name]||LOCATIONS['商场']):null;
 const isPickup=d.status==='accepted', isCarrying=d.status==='carrying';
 let phase=Number(d.phase_progress);
 if(!Number.isFinite(phase)){const progress=Number(d.progress)||0;phase=isPickup?Math.min(1,progress/.25):isCarrying?Math.max(0,Math.min(1,(progress-.25)/.75)):0}
 phase=Math.max(0,Math.min(1,phase));
 if(hasOrder){const points=isPickup?HUB_ROUTE:location.route;latest=sample(points,phase)}else{latest=sample(HUB_ROUTE,0)}
 const seq=hasOrder?d.order.seq:-1;
 if(seq!==-1&&seq!==lastSeq){showMessage('📦 新订单！'+d.order.good+' → '+d.order.place_name);lastSeq=seq;}
 if(d.status==='carrying'&&lastStatus==='accepted'){showMessage('🥤 已取餐，向'+d.order.place_name+'出发！')}
 if(d.status==='idle'&&lastStatus!=='idle'&&d.last_result&&d.last_result!==lastResult){showMessage('✅ '+d.last_result);lastResult=d.last_result;}
 if(d.status==='accepted'){$('#badge').textContent='前往商家';$('#orderName').textContent='去取 '+d.order.good;$('#destination').textContent='取餐点 · 波波奶茶店'}
 else if(d.status==='carrying'){$('#badge').textContent='配送途中';$('#orderName').textContent='配送 '+d.order.good;$('#destination').textContent='目的地 · '+d.order.place_name}
 else{$('#badge').textContent='等待接单';$('#orderName').textContent='大肥鱼正在摸鱼 🐟';$('#destination').textContent='等单中 · 欢迎弹幕互动'}
 $('#progressBar').style.width=(hasOrder?Math.round(isPickup?phase*28:28+phase*72):0)+'%';
 $('#distance').textContent=hasOrder?(isPickup?'前往商家':'前往 '+d.order.place_name):'等待派单';
 $('#left').textContent=hasOrder?String(d.left??'—')+' 秒':'—';
 $('#delivered').textContent=d.delivered??0;
 const gd=Number(d.delivered??0), ga=Number(d.goal??20);
 $('#goalDone').textContent=gd; $('#goalAll').textContent=ga;
 $('#goalBar').style.width=Math.min(100,Math.round(gd/Math.max(1,ga)*100))+'%';$('#earned').textContent='¥ '+Number(d.earned??0).toFixed(1);$('#late').textContent=d.late??0;
 lastStatus=d.status||'idle';
}
function drawRoute(){const d=state;if(!d||!d.order)return;const area=LOCATIONS[d.order.place_name]||LOCATIONS['商场'];const points=d.status==='accepted'?HUB_ROUTE:area.route;
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#526affaa';ctx.shadowBlur=13;
 let g=ctx.createLinearGradient(points[0][0],points[0][1],points.at(-1)[0],points.at(-1)[1]);g.addColorStop(0,'#aa76ff');g.addColorStop(1,'#47c7ff');ctx.strokeStyle=g;ctx.lineWidth=8;
 ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.stroke();ctx.restore();
 let point=points[points.length-1];ctx.save();ctx.beginPath();ctx.arc(point[0],point[1],18,0,Math.PI*2);ctx.fillStyle='#62c8ff5a';ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.stroke();ctx.font='25px sans-serif';ctx.textAlign='center';ctx.fillText(d.status==='accepted'?'📦':'🏠',point[0],point[1]-23);ctx.restore();}
function animate(now){let dt=Math.min(.1,(now-lastAt)/1000);lastAt=now;ticker+=dt;
 if(demo){const d=simulate(dt);update(d)}
 displayed.x+=(latest.x-displayed.x)*Math.min(1,dt*5);displayed.y+=(latest.y-displayed.y)*Math.min(1,dt*5);displayed.angle=latest.angle;
 ctx.clearRect(0,0,S.w,S.h);drawRoute();const walking=state&&(state.status==='idle'||state.status==='carrying'&&Number(state.phase_progress)>.995);rider.classList.toggle('walking',!!walking);
 const frames=walking?SPRITES.walk:SPRITES.ride;const frame=Math.floor(ticker*(walking?5:8))%4;const next=frames[frame];if(riderImg.getAttribute('src')!==next)riderImg.setAttribute('src',next);
 rider.style.left=displayed.x+'px';rider.style.top=displayed.y+'px';const reverse=Math.cos(displayed.angle)<-.15;
 rider.style.transform='translate(-50%,-82%) scaleX('+(reverse?-1:1)+')';
 requestAnimationFrame(animate)}
async function poll(){if(demo)return;try{const r=await fetch('/delivery',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);update(await r.json());$('#notice').style.display='none'}catch(e){const el=$('#notice');el.style.display='block';el.textContent='DSH 服务未连接：等待 /delivery';}finally{setTimeout(poll,850)}}
async function pollCaption(){
 try {
  const r=await fetch('/caption',{cache:'no-store'}), d=await r.json();
  const el=$('#speech');
  el.textContent=d.text ? (d.comment ? '@'+d.comment.nick+'：'+d.comment.text+'　 /　 ' : '')+d.text : '';
  el.style.display=d.text?'block':'none';
 } catch (_) { $('#speech').style.display='none'; }
 finally { setTimeout(pollCaption,250); }
}
// DSH 原动作系统继续工作：在地图舞台上用短动画做出反应，不重建动作后端。
let lastActionSeq=-1;
async function pollActions(){
 if(demo) return;
 try{
   const r=await fetch('/action_state',{cache:'no-store'}); if(!r.ok) throw Error('unavailable');
   const d=await r.json();
   if(lastActionSeq!==-1 && d.seq>lastActionSeq && d.recent && d.recent.length){
      const event=d.recent[d.recent.length-1];
      if(event.name!=='idle'){
        const names={wave:'挥手',happy:'开心',shy:'害羞',nod:'点头',laugh:'笑了',dance_cute:'跳个舞'};
        showMessage('🐟 大肥鱼：'+(names[event.name]||event.name));
        riderImg.classList.remove('reacting'); void riderImg.offsetWidth; riderImg.classList.add('reacting');
        setTimeout(()=>riderImg.classList.remove('reacting'),1200);
      }
   }
   lastActionSeq=d.seq;
 }catch(_){ /* 保留外卖场景，不依赖动作接口可用性 */ }
 finally{setTimeout(pollActions,500)}
}
if(qs.get('night')==='1')$('#night').style.display='block';
$('#cityBg').addEventListener('error',()=>{$('#notice').textContent='城市图片未加载：请检查 city_assets/city_map.png';$('#notice').style.display='block'});
if(demo){$('#caption').textContent='本地动画彩排模式 · 非 DSH 真实接口';showMessage('🎬 进入演示模式')}else {poll();pollActions();pollCaption();}requestAnimationFrame(animate);
})();
</script></body></html>
