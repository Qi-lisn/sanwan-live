<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>三万夜班电台 · 横屏</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1020}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);
    transform-origin:center;overflow:hidden;background:#1b1633;font-family:"Hiragino Sans GB","PingFang SC",sans-serif}
  #bg{position:absolute;inset:0;background:url('bg.jpg') center/cover no-repeat}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 40%,rgba(10,8,24,.55) 100%)}
  #heroWrap{position:absolute;left:50%;bottom:40px;width:740px;transform:translateX(-50%);transform-origin:50% 100%;
    animation:sway 11s ease-in-out infinite}
  #heroBob{position:relative;width:100%;transform-origin:50% 100%;animation:breathe 5.4s ease-in-out infinite}
  #hero{width:100%;display:block;filter:drop-shadow(0 16px 26px rgba(10,6,30,.55))}
  #blink,#mouth{position:absolute;inset:0;width:100%;opacity:0;transition:opacity .06s linear}
  @keyframes sway{0%,100%{transform:translateX(-50%) rotate(-.5deg)}50%{transform:translateX(-50%) rotate(.5deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
  #ground{position:absolute;left:50%;bottom:24px;width:560px;height:70px;transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(10,6,26,.6),rgba(10,6,26,0) 70%);filter:blur(10px)}
  #topbar{position:absolute;left:90px;right:90px;top:60px;display:flex;justify-content:space-between;color:#fff;
    font-size:30px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  #topbar .right{opacity:.9;font-size:26px}
  #hud{position:absolute;right:90px;top:130px;display:flex;gap:12px;color:#e6dcff;font-size:24px}
  #hud .pill{background:rgba(20,16,40,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:9px 20px}
  #bubble{position:absolute;left:50%;bottom:270px;transform:translateX(-50%);max-width:1200px;
    background:rgba(255,255,255,.94);color:#241c3d;font-size:34px;padding:16px 30px;border-radius:18px;
    opacity:0;transition:opacity .25s ease}
  #bubble.on{opacity:1}
  #caption{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);max-width:1300px;width:max-content;
    padding:16px 44px;border-radius:22px;background:rgba(20,16,40,.82);text-align:center;font-size:52px;
    line-height:1.3;color:#f6ecd2;opacity:0;transition:opacity .25s ease}
  #caption.on{opacity:1}
  #kicker{position:absolute;left:90px;bottom:52px;font-size:22px;letter-spacing:.2em;color:#9d8fc4}
  #foot{position:absolute;right:90px;bottom:52px;font-size:22px;color:#7f72a3}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="vig"></div>
  <div id="ground"></div>
  <div id="heroWrap"><div id="heroBob"><img id="hero" src="character_v3.png" alt=""><img id="blink" src="blink2.png" alt=""><img id="mouth" src="mouth_open.png" alt=""></div></div>
  <div id="topbar"><div>三万夜班电台</div><div class="right">AI 虚拟主播</div></div>
  <div id="hud"></div>
  <div id="bubble"></div>
  <div id="caption"></div>
  <div id="kicker">NIGHT SHIFT / LIVE</div>
  <div id="foot">工位 30000 · 直播中</div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
window.addEventListener('resize',fit);fit();
const cap=document.getElementById('caption');
window.setCaption=t=>{if(!t){cap.classList.remove('on');return}cap.textContent=t;cap.classList.add('on')};
let lastSeq=-1;
async function captionLoop(){try{const r=await fetch('/caption');const d=await r.json();
  if(d.seq!==lastSeq){lastSeq=d.seq;window.setCaption(d.text||'')}}catch(e){}setTimeout(captionLoop,250)}
let statSeq=-1;
async function statsLoop(){try{const r=await fetch('/stats');const d=await r.json();
  const m=Math.floor(d.uptime/60),sec=d.uptime%60;
  document.getElementById('hud').innerHTML=
    `<div class="pill">工时 ${m}:${String(sec).padStart(2,'0')}</div>`+
    `<div class="pill">摸了 ${d.moyu} 次</div>`+
    `<div class="pill">被抓 ${d.caught} 次</div>`;
  if(d.comment&&d.comment.seq>statSeq&&d.comment.text){statSeq=d.comment.seq;
    const b=document.getElementById('bubble');b.textContent='@'+d.comment.nick+'：'+d.comment.text;
    b.classList.add('on');setTimeout(()=>b.classList.remove('on'),4200)}
}catch(e){}setTimeout(statsLoop,1000)}
window.addEventListener('load',()=>{setTimeout(captionLoop,600);setTimeout(statsLoop,800);
  const bl=document.getElementById('blink'), mo=document.getElementById('mouth');
  (function blinkLoop(){const w=2800+Math.random()*4200;setTimeout(()=>{bl.style.opacity=1;setTimeout(()=>{bl.style.opacity=0;blinkLoop()},115)},w)})();
  (function mouthLoop(){const sp=cap.classList.contains('on');
    mo.style.opacity=sp&&(Math.floor(Date.now()/110)%2===0)?1:0;setTimeout(mouthLoop,90)})();
});
</script>
<script src="avatar.js"></script>
</body>
</html>
