<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>三万跑单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0d14;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;
  background:radial-gradient(ellipse at 50% 45%,#1b2136 0%,#0e1120 70%,#080a12 100%);overflow:hidden}
#map{position:absolute;inset:0}
.road{stroke:#2b3450;stroke-width:14;fill:none;stroke-linecap:round}
.road2{stroke:#242c44;stroke-width:7;fill:none;stroke-linecap:round}
.block{fill:#161c2e;stroke:#202841;stroke-width:2;rx:10}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;color:#c9d2ee;font-size:18px;letter-spacing:1px}
.node .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:#2a3450;border:2px solid #47557f;box-shadow:0 0 18px rgba(90,120,200,.25)}
.node.active .dot{background:#ffb648;border-color:#ffd08a;box-shadow:0 0 26px rgba(255,182,72,.7)}
#courier{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 35%,#fff3c9,#ffb648 60%,#e07a1f);
  box-shadow:0 0 22px rgba(255,182,72,.9),0 0 60px rgba(255,140,40,.4);transition:none}
#courier::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,182,72,.35)}
#route{stroke:#ffb648;stroke-width:5;fill:none;stroke-dasharray:2 14;stroke-linecap:round;opacity:.9}
#hud{position:absolute;left:60px;top:44px;color:#dfe6ff}
#hud .big{font-size:30px;letter-spacing:6px;color:#fff}
#hud .sub{font-size:19px;color:#8f9bc4;margin-top:8px;letter-spacing:2px}
#card{position:absolute;right:60px;top:120px;width:430px;background:rgba(18,22,38,.88);
  border:1px solid rgba(120,140,220,.3);border-radius:20px;padding:26px 28px;color:#e8edff;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#card .k{font-size:16px;color:#8f9bc4;letter-spacing:3px}
#card .good{font-size:40px;margin:10px 0 4px;color:#fff}
#card .to{font-size:23px;color:#ffd08a;margin-bottom:16px}
#card .row{display:flex;justify-content:space-between;font-size:20px;color:#c3ccec;margin-top:8px}
#card .bar{height:12px;border-radius:8px;background:#232a44;margin-top:18px;overflow:hidden}
#card .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd08a,#ff9f43);border-radius:8px}
#card .pay{font-size:34px;color:#ffd08a}
#msg{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);font-size:40px;color:#fff;
  background:rgba(12,14,24,.72);border:1px solid rgba(140,160,220,.25);border-radius:999px;padding:12px 40px;
  letter-spacing:2px;opacity:0;transition:opacity .3s}
#tag{position:absolute;left:60px;bottom:44px;font-size:18px;color:#7d88ad;letter-spacing:3px}
</style></head><body>
<div id="stage">
  <svg id="map" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <rect class="block" x="120" y="120" width="330" height="220"/>
    <rect class="block" x="120" y="470" width="330" height="300"/>
    <rect class="block" x="640" y="160" width="330" height="260"/>
    <rect class="block" x="1060" y="240" width="300" height="220"/>
    <rect class="block" x="1060" y="600" width="330" height="260"/>
    <rect class="block" x="1480" y="420" width="320" height="240"/>
    <path class="road" d="M470 640 L760 480 L980 250"/>
    <path class="road" d="M760 480 L1180 700"/>
    <path class="road" d="M1180 700 L1520 560"/>
    <path class="road" d="M980 250 L1340 330 L1520 560"/>
    <path class="road2" d="M470 640 L1180 700"/>
    <path id="route" d=""/>
  </svg>
  <div id="courier"></div>
  <div id="hud"><div class="big">三万跑单</div><div class="sub" id="sub">今日 0 单 · 赚 0.0 元</div></div>
  <div id="card">
    <div class="k">当前订单</div>
    <div class="good" id="good">等单中</div>
    <div class="to" id="to">—</div>
    <div class="row"><span>剩余时间</span><b id="left">—</b></div>
    <div class="row"><span>本单收入</span><b class="pay" id="pay">—</b></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div id="msg"></div>
  <div id="tag">午高峰 · 外卖专线</div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const COURIER=document.getElementById('courier'),ROUTE=document.getElementById('route');
const OFFICE={x:470,y:640};
let places=[],lastStatus='',lastSeq=-1;
function nodeEl(p){
  const d=document.createElement('div');d.className='node';d.id='n_'+p.id;
  d.style.left=p.x+'px';d.style.top=p.y+'px';
  d.innerHTML=`<div class="dot">${p.id==='office'?'⌂':'•'}</div>${p.name}`;
  stage.appendChild(d);return d;
}
function polyline(dest){
  // 简单两段折线：公司 → 中转点 → 目的地
  const mid={x:(OFFICE.x+dest.x)/2,y:Math.min(OFFICE.y,dest.y)-60};
  return [OFFICE,mid,dest];
}
function pointOn(pts,t){
  const segs=pts.length-1, f=Math.min(.9999,t)*segs, i=Math.floor(f), r=f-i;
  const a=pts[i],b=pts[i+1];
  return {x:a.x+(b.x-a.x)*r, y:a.y+(b.y-a.y)*r};
}
function showMsg(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;clearTimeout(showMsg._t);showMsg._t=setTimeout(()=>m.style.opacity=0,4000)}
async function tick(){
  let d;try{d=await (await fetch('/delivery',{cache:'no-store'})).json()}catch(e){return}
  if(!places.length){places=d.places;places.forEach(nodeEl);}
  document.getElementById('sub').textContent=`今日 ${d.delivered} 单 · 赚 ${d.earned.toFixed(1)} 元 · 超时 ${d.late} 次`;
  if(d.order){
    const o=d.order;
    document.getElementById('good').textContent=o.good;
    document.getElementById('to').textContent='送到 '+o.place_name;
    document.getElementById('left').textContent=d.left+' 秒';
    document.getElementById('pay').textContent='+'+o.pay.toFixed(1);
    document.getElementById('bar').style.width=Math.round(d.progress*100)+'%';
    const pts=polyline({x:o.x,y:o.y});
    ROUTE.setAttribute('d',`M${pts[0].x} ${pts[0].y} L${pts[1].x} ${pts[1].y} L${pts[2].x} ${pts[2].y}`);
    const pos=pointOn(pts,d.progress);
    COURIER.style.left=pos.x+'px';COURIER.style.top=pos.y+'px';
    document.getElementById('n_'+o.place_name).classList.toggle('active',d.progress>0.85);
    if(o.seq!==lastSeq){lastSeq=o.seq;showMsg('接到单 一份'+o.good+' 送'+o.place_name)}
  }else{
    document.getElementById('good').textContent='等单中';
    document.getElementById('to').textContent='—';
    document.getElementById('left').textContent='—';
    document.getElementById('pay').textContent='—';
    document.getElementById('bar').style.width='0%';
    ROUTE.setAttribute('d','');
    COURIER.style.left=OFFICE.x+'px';COURIER.style.top=OFFICE.y+'px';
    if(lastStatus!=='idle'&&d.last_result)showMsg(d.last_result);
  }
  lastStatus=d.status;
}
tick();setInterval(tick,1000);
</script></body></html>
