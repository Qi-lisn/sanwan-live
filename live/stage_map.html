<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>三万跑单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05070d;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden}
#bg,#lights{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;user-select:none;-webkit-user-drag:none}
#lights{mix-blend-mode:screen;animation:flicker 6s infinite ease-in-out}
#bg,#bg2{transition:opacity .6s}
@keyframes flicker{0%,100%{opacity:.85}23%{opacity:.95}41%{opacity:.72}57%{opacity:.9}73%{opacity:.8}}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(4,6,14,.45) 100%);pointer-events:none}
#scooter{position:absolute;width:230px;height:230px;transform:translate(-50%,-100%);z-index:5;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
#scooter img{width:100%;height:100%;display:block}
#light{position:absolute;width:360px;height:150px;transform-origin:0 50%;pointer-events:none;z-index:4;opacity:.9;
  background:radial-gradient(ellipse at 0 50%,rgba(255,226,160,.5),rgba(255,200,120,.14) 45%,transparent 72%);filter:blur(4px)}
#hud{position:absolute;left:64px;top:46px;color:#e6ecff;z-index:6;text-shadow:0 2px 10px rgba(0,0,0,.6)}
#hud .big{font-size:34px;letter-spacing:8px;color:#fff}
#hud .sub{font-size:19px;color:#c3cdea;margin-top:10px;letter-spacing:2px}
#badge{position:absolute;left:64px;top:134px;font-size:18px;color:#dbe2ff;letter-spacing:3px;z-index:6;
  background:rgba(14,18,32,.6);border:1px solid rgba(150,170,230,.35);border-radius:999px;padding:8px 20px;backdrop-filter:blur(6px)}
#card{position:absolute;right:62px;top:118px;width:420px;z-index:6;
  background:linear-gradient(160deg,rgba(24,30,52,.9),rgba(12,16,30,.92));
  border:1px solid rgba(140,160,235,.35);border-radius:22px;padding:24px 26px;color:#eef2ff;
  box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);backdrop-filter:blur(8px)}
#card .k{font-size:15px;color:#93a0c8;letter-spacing:4px}
#card .good{font-size:40px;margin:10px 0 2px;color:#fff}
#card .to{font-size:22px;color:#ffd08a;margin-bottom:12px}
#card .row{display:flex;justify-content:space-between;font-size:19px;color:#c3cdea;margin-top:9px}
#card .bar{height:12px;border-radius:8px;background:#202844;margin-top:16px;overflow:hidden}
#card .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd08a,#ff9f43);transition:width .9s linear}
#card .pay{font-size:30px;color:#ffd08a}
#msg{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);font-size:38px;color:#fff;z-index:7;
  background:rgba(8,12,22,.78);border:1px solid rgba(160,180,240,.35);border-radius:999px;padding:12px 42px;
  letter-spacing:2px;opacity:0;transition:opacity .35s;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#tag{position:absolute;left:64px;bottom:42px;font-size:18px;color:#9aa6cc;letter-spacing:4px;z-index:6;text-shadow:0 2px 8px rgba(0,0,0,.7)}
</style></head><body>
<div id="stage">
  <img id="bg" src="street_bg.jpg" alt="">
  <img id="lights" src="street_lights.png" alt="">
  <div id="vign"></div>
  <div id="light"></div>
  <div id="scooter"></div>
  <div id="hud"><div class="big">三万跑单</div><div class="sub" id="sub">今日 0 单 · 赚 0.0 元</div></div>
  <div id="badge">午高峰 · 外卖专线</div>
  <div id="card">
    <div class="k">当前订单</div>
    <div class="good" id="good">等单中</div>
    <div class="to" id="to">—</div>
    <div class="row"><span>剩余时间</span><b id="left">—</b></div>
    <div class="row"><span>本单收入</span><b class="pay" id="pay">—</b></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div id="msg"></div>
  <div id="tag">三万 · 工位 30000 外送</div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

/* 楼中心 x（从底图实测） */
const SHOPS={
  '公司':265, '便利店':556, '小区':802, '学校':1105, '医院':1369, '商场':1649
};
const START_X=265, LANE_Y=918;

const sc=document.getElementById('scooter'), LIGHT=document.getElementById('light');
sc.innerHTML=`<img id="riderImg" src="sprites/ride_1.png" alt="">`;

const rideFrames=['sprites/ride_1.png','sprites/ride_2.png','sprites/ride_3.png'];
const walkFrames=['sprites/walk_1.png','sprites/walk_2.png'];
let fi=0, mode='ride', walkUntil=0;
setInterval(()=>{
  const img=document.getElementById('riderImg'); if(!img) return;
  mode = Date.now() < walkUntil ? 'walk' : 'ride';
  if(mode==='walk'){ img.src=walkFrames[fi%2]; fi++; }
  else { img.src=rideFrames[fi%3]; fi++; }
},140);

let lastSeq=-1, lastStatus='';
let curLight='night';
async function loadBg(){
  try{
    const d=await (await fetch('/daypart',{cache:'no-store'})).json();
    const map={day:'street_bg_day.jpg', dusk:'street_bg_dusk.jpg', warm:'street_bg.jpg', dark:'street_bg.jpg', black:'street_bg.jpg'};
    const forced=new URLSearchParams(location.search).get('bg');
    const src=forced?('street_bg_'+forced+'.jpg'):(map[d.light]||'street_bg.jpg');
    if(src!==curLight){
      const b=document.getElementById('bg');
      if(b.getAttribute('src')!==src){ b.style.opacity=0; setTimeout(()=>{b.src=src; b.style.opacity=1;},200); }
      curLight=src;
      document.getElementById('badge').textContent=`${d.name} · 外卖专线`;
    }
  }catch(e){}
}
loadBg(); setInterval(loadBg,30000);
function showMsg(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;clearTimeout(showMsg._t);showMsg._t=setTimeout(()=>m.style.opacity=0,4200)}

async function tick(){
  let d;try{d=await (await fetch('/delivery',{cache:'no-store'})).json()}catch(e){return}
  document.getElementById('sub').textContent=`今日 ${d.delivered} 单 · 赚 ${d.earned.toFixed(1)} 元 · 超时 ${d.late} 次`;
  if(d.order){
    const o=d.order, tx=SHOPS[o.place_name]||960;
    const p=Math.min(1,d.progress), x=START_X+(tx-START_X)*p;
    document.getElementById('good').textContent=o.good;
    document.getElementById('to').textContent='送到 '+o.place_name;
    document.getElementById('left').textContent=d.left+' 秒';
    document.getElementById('pay').textContent='+'+o.pay.toFixed(1);
    document.getElementById('bar').style.width=Math.round(p*100)+'%';
    sc.style.left=x+'px'; sc.style.top=LANE_Y+'px';
    const dir=tx>=START_X?1:-1;
    sc.style.transform=`translate(-50%,-100%) scaleX(${dir})`;
    LIGHT.style.left=(x+dir*58)+'px'; LIGHT.style.top=(LANE_Y-74)+'px';
    LIGHT.style.transform=`scaleX(${dir})`;
    LIGHT.style.opacity=.9;
    if(o.seq!==lastSeq){lastSeq=o.seq;mode='ride';showMsg('接到单 一份'+o.good+' 送'+o.place_name)}
  }else{
    sc.style.left=START_X+'px'; sc.style.top=LANE_Y+'px'; sc.style.transform='translate(-50%,-100%)';
    LIGHT.style.opacity=0;
    document.getElementById('good').textContent='等单中';
    document.getElementById('to').textContent='—';
    document.getElementById('left').textContent='—';
    document.getElementById('pay').textContent='—';
    document.getElementById('bar').style.width='0%';
    if(lastStatus!=='idle'&&d.last_result){showMsg(d.last_result); mode='walk'; walkUntil=Date.now()+2600;}
  }
  lastStatus=d.status;
}
tick();setInterval(tick,1000);
</script></body></html>
