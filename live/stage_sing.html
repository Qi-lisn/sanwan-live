<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>三万 · 卖艺点歌台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#07060f}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);
    transform-origin:center;overflow:hidden;font-family:"Hiragino Sans GB","PingFang SC",sans-serif}
  #bg{position:absolute;inset:0;background:url('bg.jpg') center/cover no-repeat;filter:brightness(.62) saturate(.9)}
  #spot{position:absolute;left:50%;top:40%;width:1200px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse,rgba(180,150,255,.20),rgba(0,0,0,0) 65%)}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at 42% 50%,rgba(0,0,0,0) 35%,rgba(6,4,14,.82) 100%)}
  #heroWrap{position:absolute;left:42%;bottom:26px;width:720px;transform:translateX(-50%);transform-origin:50% 100%;
    animation:sway 12s ease-in-out infinite}
  #heroBob{position:relative;width:100%;transform-origin:50% 100%;animation:breathe 5.2s ease-in-out infinite}
  #hero{width:100%;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
  #blink,#mouth{position:absolute;inset:0;width:100%;opacity:0;transition:opacity .06s linear}
  @keyframes sway{0%,100%{transform:translateX(-50%) rotate(-.4deg)}50%{transform:translateX(-50%) rotate(.4deg)}}
  @keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}

  /* 点歌台 */
  #panel{position:absolute;right:66px;top:96px;width:520px;padding:30px 34px 34px;border-radius:28px;
    background:linear-gradient(160deg,rgba(28,20,52,.88),rgba(16,12,32,.92));
    border:1px solid rgba(190,160,255,.28);box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 60px rgba(140,110,255,.08)}
  #panel .h{display:flex;align-items:center;gap:12px;color:#c9b6ff;font-size:26px;letter-spacing:.16em}
  #panel .dot{width:10px;height:10px;border-radius:50%;background:#ff5b8a;box-shadow:0 0 14px #ff5b8a}
  #now{margin-top:22px;font-size:20px;color:#8d7fb8;letter-spacing:.1em}
  #title{margin-top:8px;font-size:40px;max-height:2.6em;overflow:hidden;word-break:break-word;line-height:1.25;color:#fff8e2;font-weight:600;
    text-shadow:0 0 26px rgba(255,214,140,.45);min-height:58px}
  #title.flip{animation:flipIn .55s cubic-bezier(.2,.8,.25,1)}
  @keyframes flipIn{0%{opacity:0;transform:translateY(16px) scale(.96);filter:blur(6px)}
    60%{opacity:1;filter:blur(0)}100%{transform:none}}
  #queue{margin-top:26px;border-top:1px dashed rgba(180,160,255,.22);padding-top:18px}
  #queue .q{display:flex;gap:10px;color:#b6a8d8;font-size:22px;line-height:1.8}
  #queue .q b{color:#ffd88a;font-weight:500}
  #empty{color:#6d6191;font-size:21px}
  #jar{margin-top:20px;display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:20px;
    background:rgba(255,200,90,.08);border:1px solid rgba(255,200,90,.22)}
  #jar .icon{font-size:44px;transition:transform .18s}
  #jar.bump .icon{animation:bump .45s}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-6deg)}100%{transform:scale(1)}}
  #jar .t{color:#ffd88a;font-size:24px}
  #jar .s{color:#a9926a;font-size:18px;margin-top:4px}
  #jar .c{margin-left:auto;color:#ffd88a;font-size:20px}
  #lib{margin-top:16px;border-top:1px dashed rgba(180,160,255,.22);padding-top:12px}
  #lib .t{color:#8d7fb8;font-size:18px;letter-spacing:.1em;margin-bottom:6px}
  #liblist{max-height:210px;overflow:hidden}
  #liblist .l{color:#a99cc9;font-size:19px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #liblist .l.on{color:#ffd88a}
  #charts{margin-top:18px;border-top:1px dashed rgba(180,160,255,.22);padding-top:14px}
  #charts .t{color:#8d7fb8;font-size:19px;letter-spacing:.1em;margin-bottom:6px}
  #charts .r{display:flex;justify-content:space-between;color:#cfc2f0;font-size:21px;line-height:1.7}
  #charts .r b{color:#ffd88a;font-weight:500}
  #price{margin-top:16px;color:#9d8fc4;font-size:20px;text-align:center;letter-spacing:.06em}

  #float{position:absolute;right:120px;top:520px;color:#ffd166;font-size:34px;opacity:0;pointer-events:none;
    text-shadow:0 0 20px rgba(255,180,60,.6)}
  #float.go{animation:pop 1.6s ease-out}
  @keyframes pop{0%{opacity:0;transform:translateY(20px) scale(.9)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.05)}}

  #topbar{position:absolute;left:90px;right:90px;top:56px;display:flex;justify-content:space-between;
    color:#fff;font-size:30px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  #topbar .right{font-size:24px;color:#c9b6ff;letter-spacing:.14em}
  #hud{position:absolute;left:90px;top:120px;display:flex;gap:12px;color:#e6dcff;font-size:22px}
  #hud .pill{background:rgba(20,16,40,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 18px}
  #caption{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);max-width:1400px;width:max-content;
    padding:14px 46px;border-radius:22px;background:rgba(16,12,32,.8);text-align:center;font-size:50px;
    line-height:1.3;color:#f8efd8;opacity:0;transition:opacity .2s;text-shadow:0 0 24px rgba(255,220,160,.25)}
  #caption.on{opacity:1}
  #foot{position:absolute;left:90px;bottom:40px;font-size:21px;color:#8d7fb8;letter-spacing:.12em}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div><div id="spot"></div><div id="vig"></div>
  <div id="heroWrap"><div id="heroBob"><img id="hero" src="character_v3.png" alt=""><img id="blink" src="blink2.png" alt=""><img id="mouth" src="mouth_open.png" alt=""></div></div>

  <div id="topbar"><div>三万卖艺点歌台</div><div class="right">卖艺中 · 点歌台</div></div>
  <div id="hud"></div>

  <div id="panel">
    <div class="h"><span class="dot"></span>点歌台 LIVE<span id="songcount" style="margin-left:auto;font-size:19px;color:#8d7fb8;letter-spacing:0">已唱 0 首</span></div>
    <div id="now">正在唱</div>
    <div id="title">—</div>
    <div id="jar"><div class="icon">🫙</div><div><div class="t" id="money">今日 ¥0.0</div><div class="s" id="lasttip">等你投币</div></div><div class="c" id="tips">0 次</div></div>
    <div id="queue"><div id="empty">还没人点歌 说一句「点歌 勋章」</div></div>
    <div id="charts"></div>
    <div id="lib"><div class="t">曲库 <span id="libn"></span></div><div id="liblist"></div></div>
    <div id="price">点歌 1 抖币 / 首 · 打赏随意</div>
  </div>
  <div id="float"></div>
  <div id="caption"></div>
  <div id="foot">点歌摊 · 直播中</div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
window.addEventListener('resize',fit);fit();
const cap=document.getElementById('caption');
window.setCaption=t=>{if(!t){cap.classList.remove('on');return}cap.textContent=t;cap.classList.add('on')};

let lastTitle='', lastTip=0, tipsInit=false;
async function singLoop(){
  try{
    const d=await (await fetch('/sing_state')).json();
    const el=document.getElementById('title');
    if(d.title && d.title!==lastTitle){
      lastTitle=d.title; el.textContent=d.title;
      el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
    } else if(!d.title){ el.textContent='—'; }
    const q=document.getElementById('queue');
    if(d.queue && d.queue.length){
      q.innerHTML=d.queue.slice(0,4).map((x,i)=>`<div class="q"><b>${i+1}</b><span>${x}</span></div>`).join('');
    } else if(!q.querySelector('#empty')){ q.innerHTML='<div id="empty">还没人点歌 说一句「点歌 勋章」</div>'; }
    if(d.library){
      document.getElementById('libn').textContent=`${d.library.length} 首`;
      document.getElementById('liblist').innerHTML=d.library.map((x,i)=>{
        const on=x.title===d.title?' on':'';
        return `<div class="l${on}">${on?'▶':'·'} ${x.title.replace('（三万翻唱）','')}</div>`;
      }).join('');
    }
    const ch=document.getElementById('charts');
    if(d.charts && d.charts.length){
      ch.innerHTML='<div class="t">点歌榜</div>'+d.charts.map((x,i)=>`<div class="r"><span>${i+1}. ${x.nick}</span><b>${x.n} 首</b></div>`).join('');
    } else ch.innerHTML='';
    if(tipsInit && d.tip_seq>lastTip){
      const jar=document.getElementById('jar'); jar.classList.remove('bump'); void jar.offsetWidth; jar.classList.add('bump');
      const f=document.getElementById('float'); f.textContent=`＋${d.last_tip.count} 谢谢 ${d.last_tip.nick}`;
      f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
      setTimeout(()=>f.classList.remove('go'),1700);
    }
    lastTip=d.tip_seq; tipsInit=true;
    document.getElementById('money').textContent=`今日 ¥${((d.coins||0)/10).toFixed(1)}`;
    document.getElementById('tips').textContent=`${d.tips} 次`;
    const sc=document.getElementById('songcount'); if(sc) sc.textContent=`已唱 ${d.songs_done} 首`;
    document.getElementById('lasttip').textContent=d.last_tip?`最近 ${d.last_tip.nick} 送了 ${d.last_tip.gift}`:'等你投币';
  }catch(e){}
  setTimeout(singLoop,600);
}
async function capLoop(){try{const d=await (await fetch('/caption')).json();window.setCaption(d.text||'');}catch(e){}setTimeout(capLoop,220)}
async function statsLoop(){try{const d=await (await fetch('/stats')).json();
  const m=Math.floor(d.uptime/60),hh=Math.floor(m/60),mm=m%60;
  const songsEl=document.getElementById('singcount');
  document.getElementById('hud').innerHTML=`<div class="pill">工时 ${hh}:${String(mm).padStart(2,'0')}</div><div class="pill">离下班 ${Math.max(0,6-hh)} 小时</div>`;
}catch(e){}setTimeout(statsLoop,2000)}
window.addEventListener('load',()=>{
  singLoop(); capLoop(); statsLoop();
  const bl=document.getElementById('blink'), mo=document.getElementById('mouth');
  (function b(){const w=2800+Math.random()*4200;setTimeout(()=>{bl.style.opacity=1;setTimeout(()=>{bl.style.opacity=0;b()},115)},w)})();
  (function m(){const sp=cap.classList.contains('on');mo.style.opacity=sp&&(Math.floor(Date.now()/110)%2===0)?1:0;setTimeout(m,90)})();
});
</script>
</body>
</html>
